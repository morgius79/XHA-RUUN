<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'IBM Plex Serif', serif">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd79a"/>
      <stop offset="55%" stop-color="#e8a33d"/>
      <stop offset="100%" stop-color="#7a4a12"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#0a0e17"/>
  <rect x="20" y="20" width="960" height="520" fill="#0d1b2a" stroke="#c9a84c" stroke-width="2"/>

  <!-- Heliopause -->
  <circle cx="430" cy="300" r="370" fill="none" stroke="#4a6b86" stroke-width="1" stroke-dasharray="3,6" opacity="0.7"/>
  <text x="430" y="288" fill="#7f9ab0" font-size="10" text-anchor="middle">гелиопауза</text>

  <!-- Orbits -->
  <g fill="none" stroke="#2a4560" stroke-width="1.2">
    <circle cx="430" cy="300" r="65"/>
    <circle cx="430" cy="300" r="105"/>
    <circle cx="430" cy="300" r="145"/>
    <circle cx="430" cy="300" r="235"/>
    <circle cx="430" cy="300" r="280"/>
    <circle cx="430" cy="300" r="325"/>
    <circle cx="430" cy="300" r="350"/>
  </g>

  <!-- Asteroid belt -->
  <g fill="none" stroke="#9b8a5a" stroke-width="1">
    <circle cx="430" cy="300" r="180" stroke-dasharray="2,5"/>
    <circle cx="430" cy="300" r="200" stroke-dasharray="2,5"/>
  </g>
  <text x="430" y="315" fill="#9b8a5a" font-size="10" text-anchor="middle">пояс астероидов</text>

  <!-- Star -->
  <circle cx="430" cy="300" r="30" fill="url(#starGlow)"/>
  <text x="430" y="305" fill="#5a2e08" font-size="11" font-weight="bold" text-anchor="middle">Khar'Vex</text>
  <text x="430" y="320" fill="#5a2e08" font-size="9" text-anchor="middle">K2V</text>

  <!-- Planets -->
  <g font-size="11" fill="#e8e4d8" text-anchor="middle">
    <!-- Vax -->
    <circle cx="430" cy="235" r="8" fill="#c97b3f" stroke="#e8e4d8" stroke-width="1"/>
    <text x="430" y="218" fill="#e8c9a0">Vax · 0.21</text>
    <!-- Xhel -->
    <circle cx="482.5" cy="209.1" r="10" fill="#b06a3a" stroke="#e8e4d8" stroke-width="1"/>
    <text x="482.5" y="192" fill="#e8c9a0">Xhel · парник</text>
    <!-- Théxar -->
    <circle cx="575" cy="300" r="13" fill="#e8a33d" stroke="#f2e2bd" stroke-width="1.5"/>
    <text x="575" y="282" fill="#f2c98a" font-weight="bold">Théxar · 0.63</text>
    <!-- Zhal -->
    <circle cx="581" cy="480" r="14" fill="#7f9b6b" stroke="#e8e4d8" stroke-width="1"/>
    <text x="581" y="500" fill="#cfe3b8">Zhal · мини-нептун</text>
    <!-- Rhuun -->
    <circle cx="700.4" cy="372.5" r="34" fill="#5c7a94" stroke="#e8e4d8" stroke-width="1.2"/>
    <ellipse cx="700.4" cy="372.5" rx="50" ry="11" fill="none" stroke="#9fc6e2" stroke-width="1.5" transform="rotate(-18 700.4 372.5)"/>
    <text x="700.4" y="345" fill="#cfe3f0" font-weight="bold">Rhuun</text>
    <text x="700.4" y="420" fill="#9fc6e2">газовый гигант · 17</text>
    <!-- Koss -->
    <circle cx="135.5" cy="162.6" r="16" fill="#8a9db8" stroke="#e8e4d8" stroke-width="1"/>
    <text x="135.5" y="142" fill="#d8e4f0">Koss · ледяной · 8</text>
    <!-- Phor -->
    <circle cx="85.3" cy="239.2" r="7" fill="#a09078" stroke="#e8e4d8" stroke-width="1"/>
    <text x="85.3" y="218" fill="#d8cbb0">Phor · 18.6</text>
  </g>

  <!-- Distance labels (a.e.) on orbit ring, top -->
  <g fill="#8a8676" font-size="9">
    <text x="430" y="230" text-anchor="middle">0.21</text>
  </g>

  <!-- Probe trajectory -->
  <path d="M 575 300 Q 800 140 800 60" fill="none" stroke="#3ddad7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 800 60 L 808 48 M 800 60 L 790 50" fill="none" stroke="#3ddad7" stroke-width="2"/>
  <text x="805" y="95" fill="#7fe8e5" font-size="10">зонд к гелиопаузе</text>

  <!-- Théxar detail callout -->
  <line x1="585" y1="300" x2="735" y2="175" stroke="#8a8676" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="740" y="55" width="210" height="175" fill="#0a1526" stroke="#3f7a6e" stroke-width="1.2"/>
  <text x="845" y="78" fill="#8cebe8" font-size="12" font-weight="bold" text-anchor="middle">Система Théxar</text>
  <!-- planet + moons -->
  <circle cx="845" cy="155" r="16" fill="#e8a33d" stroke="#f2e2bd" stroke-width="1.2"/>
  <circle cx="845" cy="125" r="9" fill="#3f5566" stroke="#dfeaf0" stroke-width="1"/>
  <circle cx="845" cy="192" r="6" fill="#123049" stroke="#dfeaf0" stroke-width="1"/>
  <text x="845" y="112" fill="#dfeaf0" font-size="9" text-anchor="middle">Serrin</text>
  <text x="845" y="205" fill="#dfeaf0" font-size="9" text-anchor="middle">Thel</text>
  <!-- lift -->
  <line x1="830" y1="155" x2="830" y2="120" stroke="#3ddad7" stroke-width="1.5"/>
  <circle cx="830" cy="117" r="3" fill="#3ddad7"/>
  <text x="800" y="105" fill="#7fe8e5" font-size="8" text-anchor="end">орбитальный лифт</text>
  <text x="845" y="245" fill="#8a8676" font-size="9" text-anchor="middle">2 спутника · обитаемая зона</text>

  <!-- Title -->
  <text x="30" y="30" fill="#c9a84c" font-size="16" font-weight="bold">ART-000014 · Звёздная система Khar'Vex</text>
  <text x="30" y="46" fill="#8a8676" font-size="10">оранжевый карлик K2V · расстояния в а.е. (схема, не в масштабе) · согласовано с Гл.02</text>

  <!-- Legend / distances -->
  <g transform="translate(40,565)">
    <rect x="-10" y="-15" width="920" height="45" fill="#0d1b2a" stroke="#c9a84c" stroke-width="1"/>
    <text x="0" y="4" fill="#e8e4d8" font-size="10">Vax 0.21 · Xhel 0.42 · Théxar 0.63 · пояс 1.15–1.65 · Zhal 2.80 · Rhuun 5.90 · Koss 11.2 · Phor 18.6 а.е.</text>
  </g>
</svg>
