<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'IBM Plex Serif', serif">
  <defs>
    <marker id="rift" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <circle cx="5" cy="5" r="2" fill="#c94c4c"/>
    </marker>
    <marker id="teeth" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e8e4d8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#0a0e17"/>
  <rect x="20" y="20" width="960" height="520" fill="#0d1b2a" stroke="#c9a84c" stroke-width="2"/>

  <!-- ============ PLATE MOSAIC ============ -->
  <!-- Continental plates: warm bronze tones. Oceanic: blue. Mixed: teal. Ice: pale. -->

  <!-- Polar (ice-oceanic), north -->
  <path d="M 20 20 L 980 20 L 980 75 Q 500 100 20 75 Z" fill="#3f5566" stroke="#e8e4d8" stroke-width="1.5"/>
  <text x="470" y="55" fill="#dfeaf0" font-size="13" font-weight="bold">Polar</text>

  <!-- Kharak (continental) -->
  <path d="M 20 75 Q 500 100 980 75 L 980 250 Q 500 275 20 250 Z" fill="#8b6f3e" stroke="#e8e4d8" stroke-width="1.5"/>
  <text x="460" y="185" fill="#f5e9c8" font-size="20" font-weight="bold">Kharak</text>
  <text x="420" y="205" fill="#e8e4d8" font-size="11">континентальная · 1.8 млн мо²</text>

  <!-- Thalas (oceanic) - band wrapping to the east flank -->
  <path d="M 780 100 Q 940 130 940 220 Q 940 300 830 320 L 800 300 Q 900 260 900 190 Q 900 140 770 115 Z" fill="#1f5f86" stroke="#e8e4d8" stroke-width="1.2"/>
  <text x="810" y="200" fill="#dff0fb" font-size="12" font-weight="bold" transform="rotate(70 850 200)">Thalas</text>

  <!-- Serrin (continental, small, stable) - west sliver -->
  <path d="M 20 130 Q 60 160 55 230 Q 40 250 20 250 Z" fill="#7a6238" stroke="#e8e4d8" stroke-width="1.2"/>
  <text x="10" y="195" fill="#f0e6c8" font-size="9" transform="rotate(-90 25 195)">Serrin</text>

  <!-- Irkhen (mixed) - between Kharak and Rhuval -->
  <path d="M 260 250 Q 400 265 540 250 L 540 300 Q 400 320 260 300 Z" fill="#3f7a6e" stroke="#e8e4d8" stroke-width="1.5"/>
  <text x="360" y="282" fill="#e8f5f0" font-size="13" font-weight="bold">Irkhen</text>

  <!-- Gharra (oceanic) - central-south band -->
  <path d="M 20 300 Q 500 325 980 300 L 980 400 Q 500 425 20 400 Z" fill="#154a6b" stroke="#e8e4d8" stroke-width="1.5"/>
  <text x="460" y="368" fill="#dff0fb" font-size="20" font-weight="bold">Gharra</text>
  <text x="420" y="388" fill="#e8e4d8" font-size="11">океаническая · 1.9 млн мо²</text>

  <!-- Rhuval (continental) south-west -->
  <path d="M 20 400 Q 260 420 400 400 L 400 540 Q 200 555 20 535 Z" fill="#a8683f" stroke="#e8e4d8" stroke-width="1.5"/>
  <text x="140" y="475" fill="#f5e9c8" font-size="17" font-weight="bold">Rhuval</text>
  <text x="90" y="495" fill="#e8e4d8" font-size="10">континентальная · 1.1 млн мо²</text>

  <!-- Koss (oceanic) - narrow strait between Rhuval and Vexar -->
  <path d="M 400 400 L 460 400 L 470 540 L 400 540 Z" fill="#0d3a57" stroke="#e8e4d8" stroke-width="1.2"/>
  <text x="405" y="470" fill="#cfe6f5" font-size="9" transform="rotate(90 430 470)">Koss</text>

  <!-- Vexar (continental) south-east -->
  <path d="M 470 400 Q 700 420 980 400 L 980 535 Q 700 555 470 540 Z" fill="#5c7a52" stroke="#e8e4d8" stroke-width="1.5"/>
  <text x="660" y="475" fill="#f0f5e0" font-size="17" font-weight="bold">Vexar</text>
  <text x="620" y="495" fill="#e8e4d8" font-size="10">континентальная · 0.9 млн мо²</text>

  <!-- Thel (oceanic, ancient/aseismic) - small pocket bottom-right -->
  <path d="M 820 400 Q 900 415 900 470 Q 860 490 820 475 Z" fill="#123049" stroke="#e8e4d8" stroke-width="1.2"/>
  <text x="835" y="445" fill="#cfe6f5" font-size="9">Thel</text>

  <!-- ============ BOUNDARY TYPES ============ -->
  <!-- Divergent (rift) — dotted red -->
  <line x1="20" y1="75" x2="980" y2="75" stroke="#c94c4c" stroke-width="2.5" stroke-dasharray="1,7" stroke-linecap="round"/>
  <!-- Convergent (subduction) — teeth -->
  <path d="M 20 250 Q 500 275 980 250" fill="none" stroke="#e8e4d8" stroke-width="2" marker-mid="url(#teeth)" marker-start="url(#teeth)" marker-end="url(#teeth)"/>
  <path d="M 400 400 Q 260 420 20 400" fill="none" stroke="#e8e4d8" stroke-width="2" marker-mid="url(#teeth)"/>
  <!-- Transform — offset dashes -->
  <line x1="400" y1="400" x2="400" y2="540" stroke="#f2c14e" stroke-width="2" stroke-dasharray="10,4"/>
  <!-- Spreading ridge -->
  <line x1="20" y1="300" x2="980" y2="300" stroke="#c94c4c" stroke-width="2" stroke-dasharray="1,6"/>

  <!-- ============ Legend ============ -->
  <g transform="translate(40,565)">
    <rect x="-10" y="-15" width="920" height="45" fill="#0d1b2a" stroke="#c9a84c" stroke-width="1"/>
    <line x1="0" y1="0" x2="30" y2="0" stroke="#c94c4c" stroke-width="2.5" stroke-dasharray="1,7"/>
    <text x="36" y="4" fill="#e8e4d8" font-size="10">дивергентная (рифт)</text>

    <path d="M 200 0 L 230 0" fill="none" stroke="#e8e4d8" stroke-width="2" marker-mid="url(#teeth)" marker-end="url(#teeth)"/>
    <text x="240" y="4" fill="#e8e4d8" font-size="10">конвергентная (субдукция)</text>

    <line x1="440" y1="0" x2="470" y2="0" stroke="#f2c14e" stroke-width="2" stroke-dasharray="10,4"/>
    <text x="478" y="4" fill="#e8e4d8" font-size="10">трансформный разлом</text>

    <text x="640" y="-3" fill="#e8e4d8" font-size="9">■ бронза — континентальная</text>
    <text x="640" y="10" fill="#e8e4d8" font-size="9">■ синий — океаническая · ■ бирюза — смешанная</text>
  </g>

  <!-- Title -->
  <text x="30" y="30" fill="#c9a84c" font-size="16" font-weight="bold">ART-000002 · Тектонические плиты Théxar</text>
  <text x="30" y="46" fill="#8a8676" font-size="10">10 плит · согласовано с Гл.12 «Геологическая эволюция», §12.3</text>
</svg>
