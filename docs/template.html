<!DOCTYPE html>
<html lang="{{htmlLang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{title}}{{titleSuffix}}</title>
<link rel="stylesheet" href="{{base}}style.css">
<style>
  .lang{float:right;margin-left:1rem;padding:.15rem .7rem;border:1px solid #e8a33d;border-radius:999px;color:#e8a33d;text-decoration:none;font-size:.85rem;line-height:1.4}
  .lang:hover{background:#e8a33d;color:#0d1b2a}
</style>
</head>
<body>
<div class="stars"></div>
<div class="container">
<nav class="breadcrumb">
<a href="{{rootBase}}">{{navLabel}}</a> › {{breadcrumb}}
{{langSwitch}}
</nav>
<article class="content">
{{content}}
</article>
<footer>
<p><a href="{{rootBase}}">← {{backLabel}}</a></p>
</footer>
</div>
</body>
</html>
