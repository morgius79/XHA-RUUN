<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" font-family="Georgia, 'IBM Plex Serif', serif">
  <defs>
    <linearGradient id="skyx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2b3d"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="skinx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a75f"/>
      <stop offset="55%" stop-color="#b9843f"/>
      <stop offset="100%" stop-color="#8b6a30"/>
    </linearGradient>
    <linearGradient id="wingx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8b6f4e" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="600" height="720" fill="url(#skyx)"/>
  <rect x="16" y="16" width="568" height="688" fill="none" stroke="#c9a84c" stroke-width="2"/>

  <!-- ground -->
  <path d="M16,660 Q300,635 584,660 L584,704 L16,704 Z" fill="#3a2e18" opacity="0.6"/>

  <!-- upper wing-arms (vex-gran), spread slightly like a cloak -->
  <path d="M300,220 C220,200 150,240 120,330 C160,310 220,300 270,320 Z" fill="url(#wingx)" stroke="#e8e4d8" stroke-width="1.5"/>
  <path d="M300,220 C380,200 450,240 480,330 C440,310 380,300 330,320 Z" fill="url(#wingx)" stroke="#e8e4d8" stroke-width="1.5"/>
  <!-- wing membrane veins -->
  <g stroke="#5a4525" stroke-width="1" opacity="0.6">
    <path d="M300,220 L160,300" fill="none"/>
    <path d="M300,220 L180,270" fill="none"/>
    <path d="M300,220 L440,300" fill="none"/>
    <path d="M300,220 L420,270" fill="none"/>
  </g>

  <!-- torso -->
  <path d="M255,300 C240,340 235,420 245,500 C250,560 260,610 300,625
           C340,610 350,560 355,500 C365,420 360,340 345,300
           C330,285 270,285 255,300 Z" fill="url(#skinx)" stroke="#e8e4d8" stroke-width="2"/>

  <!-- lower arms (sha-gran) -->
  <path d="M250,340 C210,360 190,410 195,460 C210,450 230,430 245,410" fill="none" stroke="#b9843f" stroke-width="22" stroke-linecap="round"/>
  <path d="M350,340 C390,360 410,410 405,460 C390,450 370,430 355,410" fill="none" stroke="#b9843f" stroke-width="22" stroke-linecap="round"/>
  <!-- hands (4 fingers each, schematic) -->
  <g stroke="#8b6a30" stroke-width="5" stroke-linecap="round">
    <path d="M195,460 l-8,18 M198,463 l-4,20 M203,465 l2,19 M208,463 l8,16"/>
    <path d="M405,460 l8,18 M402,463 l4,20 M397,465 l-2,19 M392,463 l-8,16"/>
  </g>

  <!-- legs (khar-gran) -->
  <path d="M280,610 C270,650 265,680 260,700" fill="none" stroke="#8b6a30" stroke-width="26" stroke-linecap="round"/>
  <path d="M320,610 C330,650 335,680 340,700" fill="none" stroke="#8b6a30" stroke-width="26" stroke-linecap="round"/>

  <!-- neck + head -->
  <path d="M275,300 C275,270 325,270 325,300 L320,260 C305,245 295,245 280,260 Z" fill="url(#skinx)" stroke="#e8e4d8" stroke-width="2"/>
  <ellipse cx="300" cy="215" rx="62" ry="52" fill="url(#skinx)" stroke="#e8e4d8" stroke-width="2"/>

  <!-- crest -->
  <path d="M300,163 C290,140 310,140 300,163 M285,168 C278,148 296,150 288,170 M315,168 C322,148 304,150 312,170"
        fill="none" stroke="#c9a84c" stroke-width="4" stroke-linecap="round"/>

  <!-- 3 eyes (tricular, frontal) -->
  <g>
    <ellipse cx="270" cy="205" rx="11" ry="8" fill="#0a0e17"/>
    <ellipse cx="270" cy="205" rx="5" ry="5" fill="#e0783c"/>
    <ellipse cx="300" cy="198" rx="11" ry="8" fill="#0a0e17"/>
    <ellipse cx="300" cy="198" rx="5" ry="5" fill="#e0783c"/>
    <ellipse cx="330" cy="205" rx="11" ry="8" fill="#0a0e17"/>
    <ellipse cx="330" cy="205" rx="5" ry="5" fill="#e0783c"/>
  </g>

  <!-- 2 pairs of ears (front + back, schematic side lobes) -->
  <ellipse cx="234" cy="222" rx="10" ry="16" fill="#a3763a" stroke="#e8e4d8" stroke-width="1"/>
  <ellipse cx="366" cy="222" rx="10" ry="16" fill="#a3763a" stroke="#e8e4d8" stroke-width="1"/>
  <ellipse cx="248" cy="250" rx="8" ry="13" fill="#8b6a30" stroke="#e8e4d8" stroke-width="1" opacity="0.85"/>
  <ellipse cx="352" cy="250" rx="8" ry="13" fill="#8b6a30" stroke="#e8e4d8" stroke-width="1" opacity="0.85"/>

  <!-- nostril slits -->
  <path d="M292,232 q4,4 0,8 M308,232 q-4,4 0,8" fill="none" stroke="#6e4f22" stroke-width="2"/>
  <!-- mouth slit -->
  <path d="M280,250 Q300,258 320,250" fill="none" stroke="#6e4f22" stroke-width="2.5"/>

  <!-- caption -->
  <text x="30" y="672" fill="#c9a84c" font-size="18" font-weight="bold">ART-000003 · Xha'Ruun</text>
  <text x="30" y="692" fill="#8a8676" font-size="10">Гексаподальный вид · тринокулярное зрение · согласовано с Гл.05</text>
</svg>
