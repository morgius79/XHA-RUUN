<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'IBM Plex Serif', serif">
  <rect x="0" y="0" width="1000" height="620" fill="#0a0e17"/>
  <rect x="20" y="20" width="960" height="520" fill="#0d1b2a" stroke="#c9a84c" stroke-width="2"/>

  <!-- Dome cross-section: concentric galleries -->
  <g fill="none" stroke="#3f7a6e" stroke-width="2">
    <path d="M 180 470 A 320 320 0 0 1 820 470"/>
    <path d="M 230 470 A 270 270 0 0 1 770 470" stroke-width="1.5"/>
    <path d="M 280 470 A 220 220 0 0 1 720 470" stroke-width="1.5"/>
    <path d="M 330 470 A 170 170 0 0 1 670 470" stroke-width="1"/>
  </g>

  <!-- Gallery floor lines -->
  <g stroke="#2a4560" stroke-width="1">
    <line x1="230" y1="470" x2="770" y2="470"/>
    <line x1="280" y1="470" x2="720" y2="470"/>
    <line x1="330" y1="470" x2="670" y2="470"/>
  </g>

  <!-- Altar (reverberator focus) -->
  <g fill="#c9a84c">
    <rect x="470" y="470" width="60" height="10"/>
    <rect x="480" y="455" width="40" height="15"/>
    <rect x="492" y="442" width="16" height="13"/>
  </g>
  <text x="500" y="435" fill="#e8c9a0" font-size="10" text-anchor="middle">алтарь</text>

  <!-- Sound waves converging from altar -->
  <g fill="none" stroke="#3ddad7" stroke-width="1.5" opacity="0.8">
    <path d="M 470 440 C 420 360 400 280 420 190" stroke="#3ddad7"/>
    <path d="M 530 440 C 580 360 600 280 580 190" stroke="#3ddad7"/>
    <path d="M 440 420 C 370 340 350 250 380 160" stroke="#e8a33d" opacity="0.6"/>
    <path d="M 560 420 C 630 340 650 250 620 160" stroke="#e8a33d" opacity="0.6"/>
  </g>

  <!-- 7 niches with Voice symbols -->
  <g>
    <path d="M 196 388 A 24 24 0 0 1 218 360" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <circle cx="207" cy="382" r="7" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <path d="M 340 183 A 24 24 0 0 1 372 158" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <path d="M 348 178 l 6 -12 l 6 12 z" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <path d="M 445 152 A 24 24 0 0 1 480 148" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <rect x="452" y="150" width="12" height="12" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <path d="M 555 152 A 24 24 0 0 1 590 158" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <path d="M 560 162 l 12 -6 l -4 12 l -12 4 z" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <path d="M 662 183 A 24 24 0 0 1 694 210" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <path d="M 678 200 l 0 -14 l 12 8 l -12 8 z" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <path d="M 810 360 A 24 24 0 0 1 816 398" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
    <path d="M 800 380 q 5 -10 12 -6 q 6 4 2 10 q -5 8 -14 4 z" fill="none" stroke="#e8a33d" stroke-width="1.5"/>
  </g>

  <!-- Labels -->
  <g font-size="10">
    <text x="470" y="300" fill="#9fe8e5" text-anchor="middle">фокус резонанса</text>
    <text x="470" y="360" fill="#9fe8e5" text-anchor="middle">зал-«ревербератор»</text>
    <text x="110" y="430" fill="#8a8676">галереи</text>
    <text x="110" y="442" fill="#8a8676">модуляции</text>
    <text x="720" y="330" fill="#e8c9a0">7 ниш ·</text>
    <text x="720" y="344" fill="#e8c9a0">7 частот Голосов</text>
  </g>

  <!-- Title -->
  <text x="30" y="30" fill="#c9a84c" font-size="16" font-weight="bold">ART-000019 · Храм-резонатор Khar-Vokh-Thel (поперечный разрез)</text>
  <text x="30" y="46" fill="#8a8676" font-size="10">акустический резонатор · согласовано с Гл.10 §10.4 и Рис. 10.2</text>

  <!-- Bottom note -->
  <g transform="translate(40,565)">
    <rect x="-10" y="-15" width="920" height="45" fill="#0d1b2a" stroke="#c9a84c" stroke-width="1"/>
    <text x="0" y="4" fill="#e8e4d8" font-size="10">шестиугольная форма → 6 точек фокуса · звук усиливается интерференцией · Храм Семи Голосов, Кхар-Вексар (−5 600 г.)</text>
  </g>
</svg>
