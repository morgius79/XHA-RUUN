<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'IBM Plex Serif', serif">
  <defs>
    <marker id="c-blood" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <circle cx="3" cy="3" r="2" fill="#3ddad7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#0a0e17"/>
  <rect x="20" y="20" width="960" height="520" fill="#0d1b2a" stroke="#c9a84c" stroke-width="2"/>

  <!-- Body silhouette (semi-transparent) -->
  <g fill="#123049" fill-opacity="0.45" stroke="#dfeaf0" stroke-width="1.5">
    <circle cx="370" cy="120" r="30"/>
    <path d="M 345 150 L 395 150 L 390 165 L 350 165 Z"/>
    <path d="M 340 180 L 400 180 L 415 385 L 325 385 Z"/>
    <line x1="345" y1="385" x2="345" y2="500" stroke="#dfeaf0" stroke-width="10" stroke-linecap="round"/>
    <line x1="395" y1="385" x2="395" y2="500" stroke="#dfeaf0" stroke-width="10" stroke-linecap="round"/>
    <path d="M 340 200 L 300 285" stroke="#dfeaf0" stroke-width="8" stroke-linecap="round"/>
    <path d="M 400 200 L 440 285" stroke="#dfeaf0" stroke-width="8" stroke-linecap="round"/>
    <path d="M 340 185 L 300 120" stroke="#dfeaf0" stroke-width="7" stroke-linecap="round"/>
    <path d="M 400 185 L 440 120" stroke="#dfeaf0" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Wings (veks) feather marks -->
  <g stroke="#dfeaf0" stroke-width="1" opacity="0.6">
    <line x1="310" y1="130" x2="322" y2="118"/>
    <line x1="298" y1="142" x2="312" y2="130"/>
    <line x1="430" y1="130" x2="418" y2="118"/>
    <line x1="442" y1="142" x2="428" y2="130"/>
  </g>

  <!-- Lungs (4) -->
  <g fill="#1a6b6a" stroke="#3ddad7" stroke-width="1.5">
    <ellipse cx="337" cy="215" rx="15" ry="24"/>
    <ellipse cx="403" cy="215" rx="15" ry="24"/>
    <ellipse cx="337" cy="285" rx="13" ry="20"/>
    <ellipse cx="403" cy="285" rx="13" ry="20"/>
  </g>

  <!-- Hearts -->
  <path d="M 370 228 q -9 -14 0 -18 q 9 4 0 18 z" fill="#c94c4c" stroke="#f2a08c" stroke-width="1"/>
  <path d="M 370 355 q -10 -16 0 -21 q 10 5 0 21 z" fill="#c94c4c" stroke="#f2a08c" stroke-width="1"/>
  <line x1="370" y1="245" x2="370" y2="340" stroke="#c94c4c" stroke-width="2.5"/>

  <!-- Blood circuits: teal (oxygenated) + red (deoxygenated) -->
  <g fill="none" stroke-width="2.5" marker-end="url(#c-blood)">
    <path d="M 370 235 C 360 200 360 160 370 150" stroke="#3ddad7"/>
    <path d="M 370 235 C 400 230 415 225 418 215" stroke="#3ddad7"/>
    <path d="M 370 235 C 340 230 325 225 322 215" stroke="#3ddad7"/>
    <path d="M 370 360 C 380 400 380 440 370 470" stroke="#c94c4c"/>
    <path d="M 370 340 C 390 320 405 300 403 285" stroke="#c94c4c"/>
    <path d="M 370 340 C 350 320 335 300 337 285" stroke="#c94c4c"/>
  </g>

  <!-- Labels -->
  <g font-size="10">
    <text x="415" y="235" fill="#8cebe8">4 лёгких</text>
    <text x="412" y="360" fill="#f2a08c">ven-thor (грудное)</text>
    <text x="412" y="420" fill="#f2a08c">ven-abd (брюшное)</text>
    <text x="412" y="450" fill="#8a8676">работают противофазно</text>
    <text x="470" y="160" fill="#8cebe8">гемолимфа</text>
    <text x="470" y="172" fill="#8cebe8">гемоцианин (Cu)</text>
    <text x="470" y="130" fill="#8a8676">крылья-вексы</text>
    <text x="470" y="270" fill="#8a8676">руки-манипуляторы</text>
  </g>

  <!-- Pulse curves -->
  <g stroke-width="2" fill="none">
    <path d="M 500 470 q 0 -20 15 -20 q 15 0 15 20 q 0 20 15 20 q 15 0 15 -20 q 0 -20 15 -20 q 15 0 15 20 q 0 20 15 20 q 15 0 15 -20" stroke="#f2a08c"/>
    <path d="M 500 495 q 0 20 15 20 q 15 0 15 -20 q 0 -20 15 -20 q 15 0 15 20 q 0 20 15 20 q 15 0 15 -20 q 0 -20 15 -20 q 15 0 15 20" stroke="#8cebe8"/>
    <text x="760" y="474" fill="#f2a08c" font-size="9">ven-thor</text>
    <text x="760" y="499" fill="#8cebe8" font-size="9">ven-abd</text>
    <text x="760" y="524" fill="#8a8676" font-size="9">противофазный ритм</text>
  </g>

  <!-- Title -->
  <text x="30" y="30" fill="#c9a84c" font-size="16" font-weight="bold">ART-000018 · Двойная кровеносная система Xha'Ruun</text>
  <text x="30" y="46" fill="#8a8676" font-size="10">два сердца · четыре лёгких · гемоцианин (Cu) · согласовано с Гл.05 §5.3</text>

  <!-- Bottom note -->
  <g transform="translate(40,565)">
    <rect x="-10" y="-15" width="920" height="45" fill="#0d1b2a" stroke="#c9a84c" stroke-width="1"/>
    <text x="0" y="4" fill="#e8e4d8" font-size="10">6 конечностей: 2 ноги · 2 руки-манипулятора · 2 крыла-вексы · два контура: головной/передний и нижний</text>
  </g>
</svg>
