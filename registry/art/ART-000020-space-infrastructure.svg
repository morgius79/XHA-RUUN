<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'IBM Plex Serif', serif">
  <defs>
    <radialGradient id="planet" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f2c98a"/>
      <stop offset="100%" stop-color="#b8762a"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#0a0e17"/>
  <rect x="20" y="20" width="960" height="520" fill="#0d1b2a" stroke="#c9a84c" stroke-width="2"/>

  <!-- Théxar -->
  <circle cx="330" cy="300" r="26" fill="url(#planet)" stroke="#f2e2bd" stroke-width="1.5"/>
  <text x="330" y="345" fill="#f2c98a" font-size="12" font-weight="bold" text-anchor="middle">Théxar</text>

  <!-- Orbital lift -->
  <line x1="330" y1="274" x2="330" y2="140" stroke="#e8a33d" stroke-width="2"/>
  <circle cx="330" cy="140" r="7" fill="#3ddad7" stroke="#9fe8e5" stroke-width="1.5"/>
  <line x1="322" y1="132" x2="322" y2="148" stroke="#3ddad7" stroke-width="1.5"/>
  <line x1="338" y1="132" x2="338" y2="148" stroke="#3ddad7" stroke-width="1.5"/>
  <text x="330" y="122" fill="#7fe8e5" font-size="9" text-anchor="middle">станция-узел</text>
  <text x="330" y="250" fill="#e8a33d" font-size="9" text-anchor="middle">лифт Кхар-Тор</text>

  <!-- 4 stations on orbit -->
  <g fill="#3ddad7">
    <rect x="466" y="176" width="10" height="10" transform="rotate(40 471 181)"/>
    <rect x="183" y="176" width="10" height="10" transform="rotate(140 188 181)"/>
    <rect x="183" y="414" width="10" height="10" transform="rotate(220 188 419)"/>
    <rect x="466" y="414" width="10" height="10" transform="rotate(320 471 419)"/>
  </g>
  <circle cx="330" cy="300" r="185" fill="none" stroke="#2a4560" stroke-width="1" stroke-dasharray="3,5"/>
  <text x="560" y="180" fill="#7fe8e5" font-size="9">4 крупные станции</text>

  <!-- GNSS ring -->
  <circle cx="330" cy="300" r="250" fill="none" stroke="#3a5a78" stroke-width="1"/>
  <g fill="#8a8676">
    <circle cx="330" cy="50" r="2.5"/><circle cx="438" cy="63" r="2.5"/><circle cx="525" cy="105" r="2.5"/>
    <circle cx="580" cy="200" r="2.5"/><circle cx="580" cy="400" r="2.5"/><circle cx="525" cy="495" r="2.5"/>
    <circle cx="438" cy="537" r="2.5"/><circle cx="330" cy="550" r="2.5"/><circle cx="222" cy="537" r="2.5"/>
    <circle cx="135" cy="495" r="2.5"/><circle cx="80" cy="400" r="2.5"/><circle cx="80" cy="200" r="2.5"/>
    <circle cx="135" cy="105" r="2.5"/><circle cx="222" cy="63" r="2.5"/>
  </g>
  <text x="330" y="575" fill="#8a8676" font-size="9" text-anchor="middle">сеть GNSS · 24 спутника</text>

  <!-- Xhel base -->
  <circle cx="660" cy="150" r="18" fill="#7a5a3e" stroke="#e8c9a0" stroke-width="1.2"/>
  <path d="M 648 144 q 12 -10 24 2 q -12 8 -24 -2 z" fill="#c97b3f"/>
  <text x="660" y="130" fill="#e8c9a0" font-size="10" text-anchor="middle">Xhel</text>
  <text x="660" y="178" fill="#8a8676" font-size="9" text-anchor="middle">база-аэростат</text>

  <!-- Veksarr mining -->
  <path d="M 700 320 l 30 -12 l 34 6 l 6 28 l -26 14 z" fill="#8a8676" stroke="#c9c4b0" stroke-width="1.2"/>
  <line x1="740" y1="356" x2="740" y2="390" stroke="#e8a33d" stroke-width="2"/>
  <rect x="730" y="390" width="20" height="8" fill="#c9a84c"/>
  <text x="760" y="345" fill="#e8c9a0" font-size="9">буровая Veksarr</text>
  <text x="760" y="357" fill="#8a8676" font-size="8">(астероид)</text>

  <!-- Probe -->
  <path d="M 520 440 Q 700 500 880 520" fill="none" stroke="#3ddad7" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 880 520 l -8 6 M 880 520 l -9 -2" stroke="#3ddad7" stroke-width="2"/>
  <text x="760" y="540" fill="#7fe8e5" font-size="9">зонд к гелиопаузе</text>

  <!-- Title -->
  <text x="30" y="30" fill="#c9a84c" font-size="16" font-weight="bold">ART-000020 · Космическая инфраструктура системы Théxar</text>
  <text x="30" y="46" fill="#8a8676" font-size="10">лифт · станции · GNSS · база Xhel · буровая Veksarr · согласовано с Гл.32 §32.3</text>

  <!-- Legend -->
  <g transform="translate(40,565)">
    <rect x="-10" y="-15" width="920" height="45" fill="#0d1b2a" stroke="#c9a84c" stroke-width="1"/>
    <line x1="0" y1="0" x2="30" y2="0" stroke="#e8a33d" stroke-width="2.5"/>
    <text x="36" y="4" fill="#e8e4d8" font-size="10">лифт Кхар-Тор</text>
    <rect x="190" y="-6" width="12" height="12" fill="#3ddad7"/>
    <text x="208" y="4" fill="#e8e4d8" font-size="10">станции</text>
    <circle cx="330" cy="0" r="3" fill="#8a8676"/>
    <text x="340" y="4" fill="#e8e4d8" font-size="10">GNSS 24</text>
    <text x="440" y="4" fill="#e8e4d8" font-size="10">Xhel — планета-парник (CO₂, 90 тяж)</text>
    <text x="700" y="4" fill="#e8e4d8" font-size="10">пояс астероидов — металлы</text>
  </g>
</svg>
