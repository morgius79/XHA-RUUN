<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Georgia, 'IBM Plex Serif', serif">
  <defs>
    <radialGradient id="crownGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a33d"/>
      <stop offset="100%" stop-color="#7a5a1e"/>
    </radialGradient>
    <radialGradient id="crownTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ddad7"/>
      <stop offset="100%" stop-color="#1a6b6a"/>
    </radialGradient>
    <radialGradient id="crownBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f7fae"/>
      <stop offset="100%" stop-color="#123049"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#0a0e17"/>
  <rect x="20" y="20" width="960" height="520" fill="#0d1b2a" stroke="#c9a84c" stroke-width="2"/>

  <!-- Root -->
  <circle cx="500" cy="472" r="7" fill="#e8e4d8"/>
  <line x1="500" y1="472" x2="500" y2="400" stroke="#e8e4d8" stroke-width="2.5"/>

  <!-- Trunk split -->
  <line x1="500" y1="400" x2="280" y2="340" stroke="#5a7a52" stroke-width="3"/>
  <line x1="500" y1="400" x2="720" y2="340" stroke="#3f7a6e" stroke-width="3"/>

  <!-- FLORA (left) -->
  <line x1="280" y1="340" x2="280" y2="120" stroke="#5a7a52" stroke-width="2.5"/>
  <g fill="#6f8f63" stroke="#c9e0b8" stroke-width="1">
    <ellipse cx="150" cy="300" rx="16" ry="10"/>
    <ellipse cx="235" cy="260" rx="16" ry="10"/>
    <ellipse cx="180" cy="210" rx="16" ry="10"/>
    <ellipse cx="245" cy="160" rx="16" ry="10"/>
    <ellipse cx="180" cy="105" rx="16" ry="10"/>
    <ellipse cx="135" cy="80"  rx="16" ry="10"/>
  </g>
  <g fill="#c9e0b8" font-size="11">
    <text x="118" y="303">фототрофы</text>
    <text x="206" y="263">таллиды</text>
    <text x="148" y="213">стратофиты</text>
    <text x="212" y="163">термолоты</text>
    <text x="148" y="108">ксилобионты</text>
    <text x="103" y="83">микоаналоги</text>
  </g>
  <text x="280" y="95" fill="#a8c99a" font-size="13" font-weight="bold" text-anchor="middle">ФЛОРА · 6 групп</text>
  <line x1="280" y1="120" x2="280" y2="95" stroke="#a8c99a" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- FAUNA (right): main stem -->
  <line x1="720" y1="340" x2="720" y2="150" stroke="#3f7a6e" stroke-width="2.5"/>
  <!-- arthropods -->
  <line x1="720" y1="290" x2="600" y2="250" stroke="#3f7a6e" stroke-width="2"/>
  <circle cx="600" cy="250" r="11" fill="#2a5f5a" stroke="#3ddad7" stroke-width="1.5"/>
  <text x="600" y="228" fill="#9fe8e5" font-size="11" text-anchor="middle">артроподы</text>
  <!-- hydrobionts -->
  <line x1="720" y1="240" x2="780" y2="210" stroke="#3f7a6e" stroke-width="2"/>
  <circle cx="780" cy="210" r="11" fill="#2a5f5a" stroke="#3ddad7" stroke-width="1.5"/>
  <text x="780" y="188" fill="#9fe8e5" font-size="11" text-anchor="middle">гидробионты</text>
  <!-- flyers -->
  <line x1="720" y1="290" x2="850" y2="255" stroke="#3f7a6e" stroke-width="2"/>
  <circle cx="850" cy="255" r="11" fill="#2a5f5a" stroke="#3ddad7" stroke-width="1.5"/>
  <text x="850" y="233" fill="#9fe8e5" font-size="11" text-anchor="middle">летуны</text>
  <!-- large predators -->
  <line x1="720" y1="200" x2="630" y2="160" stroke="#3f7a6e" stroke-width="2"/>
  <circle cx="630" cy="160" r="11" fill="#2a5f5a" stroke="#3ddad7" stroke-width="1.5"/>
  <text x="630" y="138" fill="#9fe8e5" font-size="11" text-anchor="middle">крупные хищники</text>
  <!-- intelligent branch -->
  <line x1="720" y1="150" x2="720" y2="120" stroke="#9fd8d5" stroke-width="2.5"/>

  <!-- THREE INTELLIGENT SPECIES -->
  <line x1="720" y1="120" x2="580" y2="75" stroke="#e8a33d" stroke-width="2.5"/>
  <line x1="720" y1="120" x2="740" y2="68" stroke="#3ddad7" stroke-width="2.5"/>
  <line x1="720" y1="120" x2="905" y2="80" stroke="#4a87b5" stroke-width="2.5"/>
  <circle cx="580" cy="72" r="22" fill="url(#crownGold)"/>
  <circle cx="740" cy="65" r="20" fill="url(#crownTeal)"/>
  <circle cx="905" cy="77" r="18" fill="url(#crownBlue)"/>
  <text x="580" y="38" fill="#f2c98a" font-size="13" font-weight="bold" text-anchor="middle">Xha'Ruun</text>
  <text x="580" y="50" fill="#8a8676" font-size="9" text-anchor="middle">золотистая ветвь</text>
  <text x="740" y="36" fill="#8cebe8" font-size="13" font-weight="bold" text-anchor="middle">Kel'vash</text>
  <text x="740" y="48" fill="#8a8676" font-size="9" text-anchor="middle">сине-зелёная</text>
  <text x="905" y="48" fill="#9fc6e2" font-size="13" font-weight="bold" text-anchor="middle">Moryn</text>
  <text x="905" y="60" fill="#8a8676" font-size="9" text-anchor="middle">океаническая</text>

  <!-- Branching dates -->
  <g fill="#8a8676" font-size="10">
    <text x="505" y="415">расхождение флоры / фауны</text>
    <text x="505" y="428">(~2.6 млрд лет)</text>
    <text x="730" y="285">фауна · 4 крупные линии</text>
    <text x="730" y="168">рассвет разума</text>
    <text x="730" y="181">(~60 млн лет)</text>
  </g>

  <!-- Root label -->
  <text x="500" y="492" fill="#e8e4d8" font-size="12" text-anchor="middle">Общий предок</text>
  <text x="500" y="506" fill="#8a8676" font-size="10" text-anchor="middle">(LUCA-аналог, шестибуквенный код)</text>

  <!-- Title -->
  <text x="30" y="30" fill="#c9a84c" font-size="16" font-weight="bold">ART-000013 · Эволюционное древо жизни Théxar</text>
  <text x="30" y="46" fill="#8a8676" font-size="10">схематично, не в масштабе · согласовано с Гл.04, Гл.17-18, Гл.20, Гл.38-40</text>

  <!-- Legend -->
  <g transform="translate(40,565)">
    <rect x="-10" y="-15" width="920" height="45" fill="#0d1b2a" stroke="#c9a84c" stroke-width="1"/>
    <circle cx="5" cy="0" r="6" fill="#6f8f63"/>
    <text x="16" y="4" fill="#e8e4d8" font-size="10">флора</text>
    <circle cx="115" cy="0" r="6" fill="#2a5f5a"/>
    <text x="126" y="4" fill="#e8e4d8" font-size="10">фауна</text>
    <circle cx="225" cy="0" r="8" fill="#e8a33d"/>
    <text x="238" y="4" fill="#e8e4d8" font-size="10">Xha'Ruun</text>
    <circle cx="330" cy="0" r="8" fill="#3ddad7"/>
    <text x="343" y="4" fill="#e8e4d8" font-size="10">Kel'vash</text>
    <circle cx="435" cy="0" r="8" fill="#3f7fae"/>
    <text x="448" y="4" fill="#e8e4d8" font-size="10">Moryn</text>
    <text x="560" y="4" fill="#8a8676" font-size="10">три разумных вида — вершина древа</text>
  </g>
</svg>
